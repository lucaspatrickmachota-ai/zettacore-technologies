name: Vanguard checks

on:
  push:
    paths:
      - "zettacore-vanguard/**"
      - ".github/workflows/vanguard.yml"
  pull_request:
    paths:
      - "zettacore-vanguard/**"
      - ".github/workflows/vanguard.yml"
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zettacore-vanguard
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: zettacore-vanguard/pyproject.toml
      - name: Install project and development tools
        run: python -m pip install -e ".[dev,reports]"
      - name: Run unit tests
        run: pytest -q
      - name: Check Python formatting and lint
        run: ruff check src tests
      - name: Check browser JavaScript syntax
        run: node --check web/app.js
