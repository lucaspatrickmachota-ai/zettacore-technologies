name: ZettaCore Sentinel CI

on:
  push:
    paths:
      - "zettacore-sentinel/**"
      - ".github/workflows/sentinel-ci.yml"
  pull_request:
    paths:
      - "zettacore-sentinel/**"
      - ".github/workflows/sentinel-ci.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zettacore-sentinel
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run regression and security tests
        run: pytest -q
      - name: Report synthetic benchmark metrics
        run: python scripts/benchmark_detector.py
