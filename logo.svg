<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">ZettaCore Technologies</title>
<desc id="desc">Clean, upright metallic Z emblem with exactly three strokes and no extra diagonal bar.</desc>
<defs>
 <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#ffffff"/><stop offset=".28" stop-color="#c7d0da"/><stop offset=".5" stop-color="#f1f4f8"/><stop offset=".75" stop-color="#8794a3"/><stop offset="1" stop-color="#e3e9ef"/>
 </linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dbe4ee"/><stop offset="1" stop-color="#394655"/></linearGradient>
 <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="5"/><feOffset dy="5"/><feComponentTransfer><feFuncA type="linear" slope=".3"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g filter="url(#shadow)" stroke-linejoin="round">
 <path d="M72 82 H440 V164 L176 348 H440 V430 H72 V348 L336 164 H72 Z" fill="url(#silver)" stroke="url(#edge)" stroke-width="5"/>
