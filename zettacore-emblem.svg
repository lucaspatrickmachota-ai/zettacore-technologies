<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 526 526">
<defs>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset=".25" stop-color="#cfd6de"/><stop offset=".5" stop-color="#f7fbff"/><stop offset=".76" stop-color="#a6b0ba"/><stop offset="1" stop-color="#fefefe"/></linearGradient>
 <linearGradient id="ice" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#0068ff"/><stop offset=".38" stop-color="#00a8ff"/><stop offset=".68" stop-color="#35d9ff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset=".5" stop-color="#49d7ff"/><stop offset="1" stop-color="#006bff"/></linearGradient>
 <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g filter="url(#glow)" stroke-linejoin="round">
